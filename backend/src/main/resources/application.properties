# ================== Servidor ==================
server.port=8080
spring.application.name=next-agon-backend

# ================== Banco de Dados PostgreSQL ==================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/next_agon}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ================== JPA / Hibernate ==================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ================== JWT ==================
jwt.secret=${JWT_SECRET:mude_esta_chave_para_producao_minimo_256bits_xpto}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}