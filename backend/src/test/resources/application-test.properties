
# Banco isolado para testes
spring.datasource.url=jdbc:h2:mem:nextagon_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Configuracoes JWT exclusivas para testes
jwt.secret=nextagon-test-only-secret-key-12345678901234567890
jwt.expiration=900000
jwt.refresh-expiration=604800000

# CORS de teste
app.cors.allowed-origins=http://localhost:3000

# Logs
logging.level.org.hibernate.SQL=ERROR
